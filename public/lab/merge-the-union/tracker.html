<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light;
    --bg: #FAF8F4;
    --card-bg: #FFFFFF;
    --text: #1E2433;
    --text-muted: #667085;
    --border: #D9DCE3;
    --accent: #2F6F73;
    --accent-hover: #235558;
    --accent-soft: #E8F0F0;
    --danger: #B33A3A;
    --round-font: 'SF Pro Rounded', 'Nunito', 'Quicksand', 'Avenir Next Rounded', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
    margin: 0; padding: 0; -webkit-font-smoothing: antialiased;
  }
  body { padding: 22px 24px 80px; max-width: 920px; margin: 0 auto; }

  /* === HEADER === */
  .app-header {
    display: flex; align-items: flex-start; gap: 18px; margin-bottom: 22px;
  }
  .brand-logo { width: 92px; flex-shrink: 0; }
  .brand-logo img { width: 100%; height: auto; display: block; }
  .brand { flex: 1; }
  .brand-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand h1 {
    font-family: var(--round-font);
    font-size: 30px; font-weight: 800; letter-spacing: -0.02em;
    margin: 0; line-height: 1.1; color: var(--text);
  }
  .brand-badge {
    display: inline-block;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; padding: 4px 10px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; border: 1px solid #D2DCDD;
  }
  .brand-tag {
    font-family: var(--round-font);
    font-size: 14px; font-weight: 600; color: var(--accent); margin-top: 5px;
  }
  .brand-desc {
    font-size: 13.5px; color: var(--text-muted); margin-top: 4px; line-height: 1.45;
  }

  /* === STATUS ROW === */
  .status-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 18px;
  }
  .status-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(30, 36, 51, 0.04);
  }
  .status-num {
    font-family: var(--round-font);
    font-size: 30px; font-weight: 800; line-height: 1; color: var(--text);
  }
  #count-active .status-num { color: var(--accent); }
  #count-eliminated .status-num { color: var(--text-muted); }
  .status-lbl { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .reset-card { display: flex; align-items: center; justify-content: center; padding: 8px; }
  .reset-card button {
    width: 100%; height: 100%; border: none; background: transparent;
    color: var(--text-muted); font: inherit; font-weight: 600; font-size: 13.5px;
    cursor: pointer; border-radius: 10px; padding: 10px;
    transition: background 0.15s, color 0.15s;
  }
  .reset-card button:hover { background: #FBEDED; color: var(--danger); }

  /* === LIST SECTIONS === */
  .section {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(30, 36, 51, 0.04);
  }
  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--text-muted); font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label .count-pill {
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 8px; border-radius: 999px; font-weight: 700; font-size: 11px;
  }
  .section.eliminated-section .section-label .count-pill { background: #F2EFE8; color: var(--text-muted); }

  .state-list { display: flex; flex-direction: column; gap: 6px; }
  .state-list-empty {
    color: var(--text-muted); font-style: italic; font-size: 13px; padding: 6px 4px;
  }

  .state-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 12px; background: var(--bg);
    border: 1px solid transparent; border-radius: 11px;
    cursor: pointer; user-select: none;
    transition: background 0.15s, border-color 0.15s, transform 0.05s, opacity 0.3s;
  }
  .state-item:hover { background: #F3EFE6; border-color: var(--border); }
  .state-item:active { transform: scale(0.99); }

  .state-code {
    flex-shrink: 0; font-family: var(--round-font);
    font-weight: 800; font-size: 13px; color: var(--accent);
    background: var(--accent-soft); padding: 4px 8px; border-radius: 7px;
    min-width: 36px; text-align: center; line-height: 1.2;
  }
  .state-body { flex: 1; min-width: 0; }
  .state-name { font-weight: 700; font-size: 14.5px; color: var(--text); line-height: 1.3; }
  .state-desc { font-size: 13px; color: var(--text-muted); margin-top: 3px; line-height: 1.4; }
  .state-action {
    flex-shrink: 0; align-self: center;
    font-size: 18px; color: var(--text-muted);
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--border);
    transition: all 0.15s;
  }
  .state-item:hover .state-action { border-color: var(--accent); color: var(--accent); }

  /* Eliminated styling — faded, strikethrough */
  .eliminated-section .state-item {
    opacity: 0.55; background: #f4f1ea;
  }
  .eliminated-section .state-name { text-decoration: line-through; color: var(--text-muted); }
  .eliminated-section .state-desc { text-decoration: line-through; }
  .eliminated-section .state-code { background: #ebe7dc; color: var(--text-muted); }
  .eliminated-section .state-item:hover { opacity: 0.85; }
  .eliminated-section .state-action { background: var(--card-bg); color: var(--accent); border-color: var(--accent); }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(0.97); opacity: 0.6; }
    100% { transform: scale(1); }
  }
  .state-item.flash { animation: pop 0.35s ease; }

  /* Footer */
  .footer-hint {
    text-align: center; color: var(--text-muted);
    font-size: 12.5px; font-style: italic; margin-top: 18px;
  }

  @media (max-width: 560px) {
    .status-row { grid-template-columns: 1fr 1fr; }
    .reset-card { grid-column: span 2; }
    .brand-logo { width: 72px; }
    .brand h1 { font-size: 24px; }
  }
</style>
</head>

sc": "Everyone walks at a speed that implies they are mildly furious at all times."}, {"code": "NC", "name": "North Carolina", "desc": "Three months of perfect weather and the other nine months are deeply unpredictable."}, {"code": "ND", "name": "North Dakota", "desc": "Technically exists. Most Americans could not locate it on a map."}, {"code": "OH", "name": "Ohio", "desc": "The state everyone drives through on the way to somewhere more interesting."}, {"code": "OK", "name": "Oklahoma", "desc": "Tornado season is just called \"April.\""}, {"code": "OR", "name": "Oregon", "desc": "It is illegal to pump your own gas. You will sit in your car and wait. This is the rule."}, {"code": "PA", "name": "Pennsylvania", "desc": "The Turnpike tolls are extraordinarily high and the roads do not reflect the investment."}, {"code": "RI", "name": "Rhode Island", "desc": "Smaller than most cities but refuses to let anyone forget it is technically a state."}, {"code": "SC", "name": "South Carolina", "desc": "Four months of genuinely perfect weather surrounded by eight months of swamp heat."}, {"code": "SD", "name": "South Dakota", "desc": "Mount Rushmore is the main draw, and visitors consistently report it is smaller than expected."}, {"code": "TN", "name": "Tennessee", "desc": "Nashville traffic is now on par with Los Angeles. Nobody saw this coming."}, {"code": "TX", "name": "Texas", "desc": "Everything is four hours from everything else, and it's somehow the same four hours no matter where you start."}, {"code": "UT", "name": "Utah", "desc": "Has more national parks than any other state and will mention this unprompted."}, {"code": "VT", "name": "Vermont", "desc": "The fall foliage is stunning. The maple syrup is $40 a jar."}, {"code": "VA", "name": "Virginia", "desc": "The DC traffic doesn't stop at the border. It follows you."}, {"code": "WA", "name": "Washington", "desc": "It's not the rain. It's the nine months of low gray drizzle that never fully starts and never fully stops const STORAGE_KEY = 'merge-the-union-tracker';

let eliminatedSet = new Set();
let eliminatedOrder = []; // newest first

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        eliminatedOrder = parsed.filter(c => STATES.some(s => s.code === c));
        eliminatedSet = new Set(eliminatedOrder);
      }
    }
  } catch (e) {}
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(eliminatedOrder)); } catch (e) {}
}

function makeItem(state, isEliminated) {
  const item = document.createElement('div');
  item.className = 'state-item';
  item.dataset.code = state.code;
  item.innerHTML = `
    <div class="state-code">${state.code}</div>
    <div class="state-body">
      <div class="state-name"></div>
      <div class="state-desc"></div>
    </div>
    <div class="state-action" aria-label="${isEliminated ? 'Restore' : 'Eliminate'}">${isEliminated ? '↺' : '✕'}</div>
  `;
  item.querySelector('.state-name').textContent = state.name;
  item.querySelector('.state-desc').textContent = state.desc;
  item.addEventListener('click', () => toggle(state.code));
  return item;
}

function render() {
  const activeHost = document.getElementById('active-list');
  const elimHost = document.getElementById('eliminated-list');
  activeHost.innerHTML = '';
  elimHost.innerHTML = '';

  const activeStates = STATES.filter(s => !eliminatedSet.has(s.code));
  // Eliminated in REVERSE order (newest at top of the eliminated list)
  const elimStates = eliminatedOrder.slice().reverse()
                      .map(code => STATES.find(s => s.code === code))
                      .filter(Boolean);

  if (activeStates.length === 0) {
    activeHost.innerHTML = '<div class="state-list-empty">All states eliminated. Glory be to the empire.</div>';
  } else {
    activeStates.forEach(s => activeHost.appendChild(makeItem(s, false)));
  }

  if (elimStates.length === 0) {
    document.getElementById('eliminated-section').style.display = 'none';
  } else {
    document.getElementById('eliminated-section').style.display = '';
    elimStates.forEach(s => elimHost.appendChild(makeItem(s, true)));
  }

  document.getElementById('num-active').textContent = activeStates.length;
  document.getElementById('num-eliminated').textContent = elimStates.length;
  document.getElementById('pill-active').textContent = activeStates.length;
  document.getElementById('pill-eliminated').textContent = elimStates.length;
}

function toggle(code) {
  if (eliminatedSet.has(code)) {
    eliminatedSet.delete(code);
    eliminatedOrder = eliminatedOrder.filter(c => c !== code);
  } else {
    eliminatedSet.add(code);
    eliminatedOrder.push(code);
  }
  save();
  render();
}

document.getElementById('btn-reset').addEventListener('click', () => {
  if (eliminatedSet.size === 0) return;
  if (confirm('Bring all states back? This clears your tracker.')) {
    eliminatedSet = new Set();
    eliminatedOrder = [];
    save();
    render();
  }
});

load();
render();
</script>
